<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Connected Authors: Sagnik Edition (embed)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* Layout: plot area only, filling the whole frame (website embed); data is a frozen snapshot embedded below */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#17202b; --muted:#5d6876; --line:#dfe3e9;
  --node:#2f5d8a; --node-hi:#c4572e; --edge:#8a95a3; --graph-bg:#fbfcfd;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2029; --fg:#e6ebf1; --muted:#9aa5b3; --line:#2c3440;
  --node:#7fb0e0; --node-hi:#f0a07c; --edge:#6b7685; --graph-bg:#151a21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a2029; --fg:#e6ebf1; --muted:#9aa5b3; --line:#2c3440;
  --node:#7fb0e0; --node-hi:#f0a07c; --edge:#6b7685; --graph-bg:#151a21; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:600;font-size:1.6rem;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:4px 0 0;max-width:70ch}
.graphbox{display:grid;grid-template-columns:minmax(0,1fr) 270px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--graph-bg)}
@media (max-width:760px){.graphbox{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;height:clamp(420px,74vh,780px);min-width:0}
.stage svg{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.stage svg:active{cursor:grabbing}
.gtools{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gbtn{all:unset;box-sizing:border-box;cursor:pointer;font-size:.78rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.gbtn:hover{border-color:var(--fg)}
.gbtn:focus-visible{outline:2px solid var(--node);outline-offset:2px}
.gbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.find{font:inherit;font-size:.8rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:180px;min-width:0}
.find:focus-visible{outline:2px solid var(--node);outline-offset:1px}
.legend{position:absolute;left:10px;bottom:10px;font-size:.75rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;max-width:calc(100% - 20px)}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:.8rem;box-shadow:0 4px 14px rgba(0,0,0,.12);max-width:240px}
.panel{border-left:1px solid var(--line);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:auto;max-height:clamp(420px,74vh,780px)}
@media (max-width:760px){.panel{border-left:0;border-top:1px solid var(--line);max-height:none}}
.panel h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0}
.meta{font-size:.82rem;color:var(--muted);margin:0}
.panel ol{margin:0;padding-left:1.2em;font-size:.85rem;display:flex;flex-direction:column;gap:2px}
.panel ol button{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.panel ol button:hover{text-decoration-color:var(--fg)}
.w{font-variant-numeric:tabular-nums;color:var(--muted)}
.node{cursor:pointer}
.node text{font-family:var(--body);font-size:10px;fill:var(--fg);paint-order:stroke;stroke:var(--graph-bg);stroke-width:3px;pointer-events:none}
.foot{font-size:.78rem;color:var(--muted)}
html,body{height:100%;overflow:hidden}
body{padding:0!important}
.stage{height:100%!important;width:100%;background:var(--graph-bg)}
</style>


</head>
<body>
<div class="stage" id="stage">
      <svg id="svg" role="img" aria-label="Co-author graph of the authors in my paper collection"></svg>
      <div class="gtools">
        <input class="find" id="find" list="names" type="search" placeholder="Find someone…" aria-label="Find someone and centre the graph on them">
        <datalist id="names"></datalist>
        <button class="gbtn" id="only" type="button" aria-pressed="false" title="When someone is selected, hide everyone who is not their co-author">Only their cluster</button>
        <button class="gbtn" id="lonely" type="button" aria-pressed="false">Hide unlinked</button>
        <button class="gbtn" id="labels" type="button" aria-pressed="false">All names</button>
        <button class="gbtn" id="reset" type="button">Reset view</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
<aside class="panel" id="panel" hidden></aside>
<p class="foot" id="foot" hidden></p>
